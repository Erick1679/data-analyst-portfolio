name: Brights Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - feature/brights-retail-foundation
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retail-tests:
    name: Django Retail PostgreSQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: brights_ci_test_only
          POSTGRES_DB: brights_analytics_dev_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brights_analytics_dev_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "ci-only-not-for-production-use-rotate"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      BRIGHTS_DATABASE_ENGINE: "postgresql"
      BRIGHTS_POSTGRES_DB: "brights_analytics_dev_db"
      BRIGHTS_POSTGRES_USER: "postgres"
      BRIGHTS_POSTGRES_PASSWORD: "brights_ci_test_only"
      BRIGHTS_POSTGRES_HOST: "127.0.0.1"
      BRIGHTS_POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Django configuration
        run: python manage.py check

      - name: Verify migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Execute retail PostgreSQL tests
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py test retail --noinput --verbosity 1
